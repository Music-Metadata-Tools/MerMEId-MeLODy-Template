name: Build and Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  fetch_sparql_queries:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install curl
        run: apk add --no-cache curl

      - name: Fetch SPARQL queries
        run: sh ./modules/datasets-generator/fetch-sparql-queries.sh

      - name: Upload query artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparql-queries
          path: sparql-queries

  generate_datasets:
    runs-on: ubuntu-latest
    needs: fetch_sparql_queries
    container:
      image: registry.gitlab.rlp.net/adwmainz/nfdi4culture/cdmd/static-publishing-backend/static-publishing-backend:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download query artifact
        uses: actions/download-artifact@v4
        with:
          name: sparql-queries
          path: sparql-queries

      - name: Generate datasets
        run: ./modules/datasets-generator/datasets-generator.sh

      - name: Upload indexes artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexes
          path: indexes

  push-indexes:
    runs-on: ubuntu-latest
    needs: generate_datasets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download indexes artifact
        uses: actions/download-artifact@v4
        with:
          name: indexes
          path: indexes

      - name: Commit and push indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add indexes
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Updated indexes [skip ci]"
          git push origin main
